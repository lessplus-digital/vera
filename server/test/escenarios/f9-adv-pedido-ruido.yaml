nombre: Adversarial — cambios, ruido y arrepentimiento en el carrito
descripcion: >
  Cantidad, cambio de cantidad, emojis y signos sueltos, "ya no quiero nada" y
  un "sí" final: el carrito siempre refleja lo último que el cliente dijo y
  nada se crea sin resumen.
critico: true
bot: decision
telefono: '573000000929'
nombre_cliente: Andrés Gil
cliente_registrado: true
pasos:
  - envia: quiero 2 hawaianas tradicionales medianas
    debe:
      bd: { carrito_total: 75000 }
      turno: { sin_acciones: [crear_pedido] }
  - envia: 👍
    debe:
      bd: { carrito_total: 75000 }
      turno: { sin_acciones: [crear_pedido] }
  - envia: mejor solo una
    debe:
      bd: { carrito_total: 37500 }
      turno: { sin_acciones: [crear_pedido] }
  - envia: '???'
    debe:
      bd: { carrito_total: 37500 }
      turno: { sin_acciones: [crear_pedido] }
  - envia: ya no quiero nada
    debe:
      bd: { carrito: [] }
      turno: { sin_acciones: [crear_pedido] }
  - envia: sí
    debe:
      no_contiene: ['¡Pedido registrado', 'PED-']
      bd: { carrito: [] }
      turno: { sin_acciones: [crear_pedido] }
